    <div class="content">
        <h2>Dashboard Aplikasi SITTA</h2>
        <p id="greetingMessage" style="font-size: 18px; margin-top: 10px; font-weight: bold; color: #555;"></p>
    </div>

    <script>
        const hours = new Date().getHours();
        let greeting = "Selamat malam";

        if (hours >= 4 && hours < 11) {
            greeting = "Selamat pagi";
        } else if (hours >= 11 && hours < 15) {
            greeting = "Selamat siang";
        } else if (hours >= 15 && hours < 18) {
            greeting = "Selamat sore";
        }

        document.getElementById('greetingMessage').innerText = `${greeting}, Pengguna SITTA.`;
    </script>
